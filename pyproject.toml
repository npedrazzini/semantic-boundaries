[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semantic-boundaries"
version = "0.2.0"
description = "Utilities for semantic-space analysis and lexical associations in word-aligned parallel data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "scikit-learn"
]

[project.urls]
Homepage = "https://github.com/npedrazzini/semantic-boundaries"
Repository = "https://github.com/npedrazzini/semantic-boundaries"