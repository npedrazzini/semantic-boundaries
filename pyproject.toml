[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semantic-boundaries"
version = "0.1.0"
description = "Utilities for constructing boundaries around 2D semantic spaces"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy"
]

[project.urls]
Homepage = "https://github.com/npedrazzini/semantic-boundaries"
Repository = "https://github.com/npedrazzini/semantic-boundaries"